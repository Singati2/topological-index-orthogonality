name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Tests do not download datasets; they check the math, the span
        # certificate, and the committed result files. RDKit is needed only
        # because scripts/70 imports the SMILES loader at module level.
        run: |
          python -m pip install --upgrade pip
          pip install networkx numpy pandas scipy scikit-learn rdkit pytest

      - name: Run pytest
        run: pytest tests/ -v
